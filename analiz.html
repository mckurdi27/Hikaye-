<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin ve Kelime Analiz Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>📊 Metin ve Kelime Analiz Paneli</h1>
        <p>JSON dosyalarınızdaki hikaye ve kelime sıklıklarını analiz edin.</p>
        <a href="index.html" class="btn-analiz-link" style="display:inline-block; margin-top:10px;">🏠 Ana Sayfaya Dön</a>
    </div>

    <div class="container">
        
        <div class="card">
            <h3>1. Veri Kaynağı Seçimi</h3>
            <div class="source-panel active-panel">
                <label for="jsonSelect"><strong>Taranacak Dosya / Grubu Seçin:</strong></label>
                <select id="jsonSelect" style="width:100%; padding:10px; margin-top:8px; border-radius:6px; border:1px solid #ccc;">
                    <option value="ALL">📁 Tüm Hikayeleri Tara</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h3>2. İşlem Türü (Analiz Modu)</h3>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="action-btn active-btn" onclick="setTask('hikaye', this)">📖 Hikaye Metni Analizi (story.en)</button>
                <button class="action-btn" onclick="setTask('kelimeler', this)">📋 Kelime Listesi Analizi (words)</button>
            </div>
        </div>

        <div class="card">
            <h3>3. Analiz Sonucu</h3>
            <button onclick="runAnalysis()" style="background:#4A90E2; color:white; border:none; padding:12px 20px; font-weight:bold; border-radius:6px; cursor:pointer; width:100%;">🚀 Analizi Çalıştır</button>
            
            <div id="status" style="margin-top:15px; font-weight:bold; color:#333;"></div>
            <div id="resultArea" style="margin-top:15px;"></div>
        </div>

    </div>

    <script>
        let state = { task: 'hikaye' };
        let daysData = [];

        // Sayfa açıldığında doğrudan days.json dosyasından listenizi yükler
        window.addEventListener('DOMContentLoaded', async () => {
            const selectEl = document.getElementById('jsonSelect');
            try {
                let res = await fetch('days.json');
                if (res.ok) {
                    daysData = await res.json();
                    selectEl.innerHTML = '<option value="ALL">📁 Tüm Hikayeleri Tara (' + daysData.length + ' Gün)</option>';
                    daysData.forEach((day, idx) => {
                        let opt = document.createElement('option');
                        // day.file / day.path / day.id kontrolü
                        opt.value = day.file || day.path || (`day-${idx < 9 ? '0' + (idx + 1) : (idx + 1)}.json`);
                        opt.text = (day.dayTitle || day.title || `Gün ${idx + 1}`) + ` (${opt.value})`;
                        selectEl.appendChild(opt);
                    });
                } else {
                    fallbackSelect(selectEl);
                }
            } catch (e) {
                fallbackSelect(selectEl);
            }
        });

        function fallbackSelect(selectEl) {
            selectEl.innerHTML = '<option value="ALL">📁 Tüm Hikayeleri Tara (Yedek Mod)</option>';
            for (let i = 1; i <= 180; i++) {
                let formatted = i < 10 ? '0' + i : i;
                let opt = document.createElement('option');
                opt.value = `day-${formatted}.json`;
                opt.text = `Gün ${i} (day-${formatted}.json)`;
                selectEl.appendChild(opt);
            }
        }

        function setTask(t, btn) {
            state.task = t;
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
        }

        async function runAnalysis() {
            const statusDiv = document.getElementById('status');
            const resultArea = document.getElementById('resultArea');
            statusDiv.innerHTML = "⏳ Taranıyor...";
            resultArea.innerHTML = "";
            
            let target = document.getElementById('jsonSelect').value;
            let filesToFetch = [];

            if (target === "ALL") {
                if (daysData.length > 0) {
                    filesToFetch = daysData.map((d, idx) => d.file || d.path || `day-${idx < 9 ? '0' + (idx + 1) : (idx + 1)}.json`);
                } else {
                    for (let i = 1; i <= 180; i++) filesToFetch.push(`day-${i < 10 ? '0' + i : i}.json`);
                }
            } else {
                filesToFetch.push(target);
            }

            let itemTracking = {};
            let totalWords = 0;
            let loadedCount = 0;

            for (let path of filesToFetch) {
                loadedCount++;
                let percent = Math.round((loadedCount / filesToFetch.length) * 100);
                statusDiv.innerText = `⏳ Taranıyor: %${percent} (${loadedCount}/${filesToFetch.length})`;

                try {
                    let res = await fetch(path);
                    if (!res.ok && !path.startsWith('days/')) {
                        // Klasör içindeyse yedek deneme
                        res = await fetch('days/' + path);
                    }

                    if (res.ok) {
                        let data = await res.json();
                        let textToScan = "";

                        if (state.task === 'hikaye') {
                            textToScan = (data.story && data.story.en) || (typeof data.story === 'string' ? data.story : "");
                        } else if (state.task === 'kelimeler' && data.words) {
                            textToScan = data.words.map(w => (w.term && w.term.en) || w.word || (typeof w === 'string' ? w : '')).join(" ");
                        }

                        if (textToScan) {
                            let cleanWords = textToScan.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, " ").toLowerCase().split(/\s+/);
                            cleanWords.forEach(w => {
                                let cleanW = w.trim();
                                if (cleanW.length > 1 && !/^\d+$/.test(cleanW)) {
                                    totalWords++;
                                    if (!itemTracking[cleanW]) itemTracking[cleanW] = { word: cleanW, count: 0 };
                                    itemTracking[cleanW].count++;
                                }
                            });
                        }
                    }
                } catch (e) {}
            }

            if (Object.keys(itemTracking).length === 0) {
                statusDiv.innerHTML = "❌ <b>Kelime Bulunamadı!</b> Sayfayı yenileyip tek bir gün seçerek deneyiniz veya GitHub sunucunun güncellenmesini (1-2 dk) bekleyiniz.";
                return;
            }

            statusDiv.innerText = "✅ Analiz tamamlandı!";
            let rows = Object.values(itemTracking).sort((a,b) => b.count - a.count).map((item, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${item.word}</strong></td>
                    <td>${item.count}</td>
                </tr>
            `).join('');

            resultArea.innerHTML = `
                <p><strong>Toplam Taranan Kelime:</strong> ${totalWords} | <strong>Benzersiz Kelime:</strong> ${Object.keys(itemTracking).length}</p>
                <div class="table-container">
                    <table>
                        <thead><tr><th>#</th><th>Kelime (EN)</th><th>Frekans</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
