<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin ve Kelime Analiz Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>📊 Metin ve Kelime Analiz Paneli</h1>
        <p>JSON dosyalarınızdaki hikaye ve kelime sıklıklarını analiz edin.</p>
        <a href="index.html" class="btn-analiz-link" style="display:inline-block; margin-top:10px;">🏠 Ana Sayfaya Dön</a>
    </div>

    <div class="container">
        
        <!-- 1. Kaynak Seçimi -->
        <div class="card">
            <h3>1. Veri Kaynağı Seçimi</h3>
            <div class="source-tabs">
                <button class="source-tab-btn active-source" onclick="switchSourceTab(0, this)">📂 JSON Dosyaları (180 Gün)</button>
            </div>

            <div class="source-panel active-panel">
                <label for="jsonSelect"><strong>Taranacak Dosyayı veya Grubu Seçin:</strong></label>
                <select id="jsonSelect" style="width:100%; padding:10px; margin-top:8px; border-radius:6px; border:1px solid #ccc;">
                    <!-- JavaScript ile 180 gün dinamik dolacak -->
                </select>
            </div>
        </div>

        <!-- 2. İşlem Türü -->
        <div class="card">
            <h3>2. İşlem Türü (Analiz Modu)</h3>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="action-btn active-btn" onclick="setTask('hikaye', this)">📖 Hikaye Metni Analizi (story.en)</button>
                <button class="action-btn" onclick="setTask('kelimeler', this)">📋 Kelime Listesi Analizi (words)</button>
            </div>
        </div>

        <!-- 3. Sonuç Paneli -->
        <div class="card">
            <h3>3. Analiz Sonucu</h3>
            <button onclick="runAnalysis()" style="background:#4A90E2; color:white; border:none; padding:12px 20px; font-weight:bold; border-radius:6px; cursor:pointer; width:100%;">🚀 Analizi Çalıştır</button>
            
            <div id="status" style="margin-top:15px; font-weight:bold; color:#333;"></div>
            <div id="resultArea" style="margin-top:15px;"></div>
        </div>

    </div>

    <script>
        let state = { task: 'hikaye' };

        // 180 Günlük Yapıyı Doldur (days/day-1.json ... days/day-180.json)
        window.addEventListener('DOMContentLoaded', () => {
            const selectEl = document.getElementById('jsonSelect');
            selectEl.innerHTML = '<option value="ALL">📁 Tüm Günleri Tara (Day 1 - 180)</option>';
            
            // 30'ar günlük gruplar halinde düzenleyelim
            for (let b = 1; b <= 6; b++) {
                let optGroup = document.createElement('optgroup');
                let startDay = (b - 1) * 30 + 1;
                let endDay = b * 30;
                optGroup.label = `--- Blok ${b} (Gün ${startDay} - ${endDay}) ---`;
                
                let groupAllOpt = document.createElement('option');
                groupAllOpt.value = `BLOCK_${b}`;
                groupAllOpt.textContent = `📂 Blok ${b} (Gün ${startDay} - ${endDay}) Tümünü Tara`;
                optGroup.appendChild(groupAllOpt);

                for (let d = startDay; d <= endDay; d++) {
                    let fileName = `days/day-${d}.json`;
                    let option = document.createElement('option');
                    option.value = fileName;
                    option.text = `Gün ${d} (${fileName})`;
                    optGroup.appendChild(option);
                }
                selectEl.appendChild(optGroup);
            }
        });

        function setTask(t, btn) {
            state.task = t;
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
        }

        async function runAnalysis() {
            const statusDiv = document.getElementById('status');
            const resultArea = document.getElementById('resultArea');
            
            statusDiv.innerHTML = "⏳ Analiz başlatılıyor...";
            resultArea.innerHTML = "";
            
            let filesToFetch = [];
            const selectedTarget = document.getElementById('jsonSelect').value;

            if (selectedTarget === "ALL") {
                for (let d = 1; d <= 180; d++) {
                    filesToFetch.push(`days/day-${d}.json`);
                }
            } else if (selectedTarget.startsWith("BLOCK_")) {
                let blockNum = parseInt(selectedTarget.replace("BLOCK_", ""));
                let startDay = (blockNum - 1) * 30 + 1;
                let endDay = blockNum * 30;
                for (let d = startDay; d <= endDay; d++) {
                    filesToFetch.push(`days/day-${d}.json`);
                }
            } else {
                filesToFetch.push(selectedTarget);
            }

            let itemTracking = {};
            let totalWords = 0;
            let loadedCount = 0;

            for (let path of filesToFetch) {
                loadedCount++;
                let percent = Math.round((loadedCount / filesToFetch.length) * 100);
                statusDiv.innerText = `⏳ Taranıyor: %${percent} (${loadedCount}/${filesToFetch.length})`;

                try {
                    let res = await fetch(path);
                    if (res.ok) {
                        let data = await res.json();
                        let textToScan = "";

                        // 1. Hikaye Metni Taraması (story.en)
                        if (state.task === 'hikaye') {
                            if (data.story && data.story.en) {
                                textToScan = data.story.en;
                            }
                        } 
                        // 2. Kelime Listesi Taraması (words[].term.en)
                        else if (state.task === 'kelimeler' && data.words) {
                            textToScan = data.words
                                .map(w => (w.term && w.term.en) ? w.term.en : "")
                                .filter(Boolean)
                                .join(" ");
                        }

                        if (textToScan) {
                            let cleanWords = textToScan
                                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, " ")
                                .toLowerCase()
                                .split(/\s+/);

                            cleanWords.forEach(w => {
                                let cleanW = w.trim();
                                if (cleanW.length > 1 && !/^\d+$/.test(cleanW)) {
                                    totalWords++;
                                    if (!itemTracking[cleanW]) itemTracking[cleanW] = { word: cleanW, count: 0 };
                                    itemTracking[cleanW].count++;
                                }
                            });
                        }
                    }
                } catch (e) {
                    console.log("Dosya okunamadı:", path);
                }
            }

            if (Object.keys(itemTracking).length === 0) {
                statusDiv.innerHTML = "❌ <b>Kelime Bulunamadı!</b> Seçtiğiniz gün/dosya okunamadı veya içi boş.";
                return;
            }

            statusDiv.innerText = "✅ Analiz başarıyla tamamlandı!";
            
            let rows = Object.values(itemTracking)
                .sort((a,b) => b.count - a.count)
                .map((item, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${item.word}</strong></td>
                        <td>${item.count}</td>
                    </tr>
                `).join('');

            resultArea.innerHTML = `
                <div style="margin-bottom:10px;">
                    <strong>Toplam Taranan Kelime:</strong> ${totalWords} | 
                    <strong>Benzersiz Kelime:</strong> ${Object.keys(itemTracking).length}
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>#</th><th>Kelime (EN)</th><th>Frekans</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
