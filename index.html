<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Her Güne 1 Hikaye — 16 Dilde Günlük İngilizce Hikayeler"
  >

  <meta
    name="theme-color"
    content="#f5f1e8"
  >

  <title>Her Güne 1 Hikaye</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================================
       ANA SAYFA
  ========================================== -->

  <main id="home-page">

    <header class="home-header">

      <!-- 16 DİL -->

      <div
        id="home-language-selector"
        class="language-selector"
        aria-label="Dil seçimi"
      ></div>


      <!-- =========================================
           HERO
           HİKAYE KİTABI SİMGESİ
      ========================================== -->

      <div class="story-hero">
        <div class="story-hero-icon" aria-hidden="true">📖</div>
        <svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 256 256">

  <!-- Arka plan -->
  <rect x="0" y="0" width="256" height="256" fill="#f7f7f7"/>

  <!-- Dünya (basit küre) -->
  <circle cx="128" cy="128" r="70"
          fill="#ffffff"
          stroke="#222222"
          stroke-width="2"/>

  <!-- Enlem çizgileri (stilize) -->
  <circle cx="128" cy="128" r="50"
          fill="none"
          stroke="#cccccc"
          stroke-width="1"/>
  <circle cx="128" cy="128" r="30"
          fill="none"
          stroke="#cccccc"
          stroke-width="1"/>

  <!-- Boylam çizgileri (stilize) -->
  <path d="M128 58 L128 198"
        stroke="#cccccc"
        stroke-width="1"
        fill="none"/>
  <path d="M78 78 C128 88 128 168 78 178"
        stroke="#cccccc"
        stroke-width="1"
        fill="none"/>
  <path d="M178 78 C128 88 128 168 178 178"
        stroke="#cccccc"
        stroke-width="1"
        fill="none"/>

  <!-- Üst kırmızı halka (yarım yay) -->
  <path d="M40 128
           A88 88 0 0 1 216 128"
        fill="none"
        stroke="#ff1e1e"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Alt sol sarı halka (kesik yay) -->
  <path d="M64 190
           A88 88 0 0 1 128 216"
        fill="none"
        stroke="#ffd400"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Alt sağ yeşil halka (kesik yay) -->
  <path d="M128 216
           A88 88 0 0 1 192 190"
        fill="none"
        stroke="#00b54a"
        stroke-width="10"
        stroke-linecap="round"/>

        </svg>
      </div>


      <!-- =========================================
           BAŞLIK
           SİMGENİN ALTINDA
      ========================================== -->

      <div class="roadmap-title">

        <div>
          Her Güne
        </div>

        <div>
          1 Hikaye
        </div>

      </div>


      <!-- ALT AÇIKLAMA -->

      <p class="home-subtitle">
        16 dilde günlük hikayelerle kelime öğren
      </p>

    </header>


    <!-- =========================================
         GÜNLER
    ========================================== -->

    <section class="days-section">

      <h2>
        Günler
      </h2>

      <div id="days-list">

        <p class="loading-days">
          Günler yükleniyor...
        </p>

      </div>

    </section>

  </main>



  <!-- =========================================
       SORU SAYFASI
  ========================================== -->

  <main
    id="question-page"
    style="display: none;"
  >


    <!-- DİL SEÇİCİ -->

    <div
      id="language-selector"
      class="language-selector"
      aria-label="Dil seçimi"
    ></div>


    <!-- ÜST NAVİGASYON -->

    <nav
      id="top-navigation"
      class="navigation"
      aria-label="Soru navigasyonu"
    ></nav>


    <!-- SORU İÇERİĞİ -->

    <section
      id="question-content"
      class="question-content"
    ></section>


    <!-- ALT NAVİGASYON -->

    <nav
      id="bottom-navigation"
      class="navigation"
      aria-label="Alt navigasyon"
    ></nav>

  </main>



  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer>

    <p>
      Her Güne 1 Hikaye
    </p>

  </footer>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>

</html>
