<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Her Güne 1 Hikaye — 16 Dilde Günlük İngilizce Hikayeler"
  >

  <meta
    name="theme-color"
    content="#f5f1e8"
  >

  <title>Her Güne 1 Hikaye</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================================
       ANA SAYFA
  ========================================== -->

  <main id="home-page">

    <header class="home-header">

      <!-- 16 DİL -->

      <div
        id="home-language-selector"
        class="language-selector"
        aria-label="Dil seçimi"
      ></div>


      <!-- =========================================
           HERO
           HİKAYE KİTABI SİMGESİ
      ========================================== -->

      <div class="story-hero">
        <div class="story-hero-icon" aria-hidden="true">📖</div>
      </div>


      <!-- =========================================
           BAŞLIK
           SİMGENİN ALTINDA
      ========================================== -->

      <div class="roadmap-title">

        <div>
          Her Güne
        </div>

        <div>
          1 Hikaye
        </div>

      </div>


      <!-- ALT AÇIKLAMA -->

      <p class="home-subtitle">
        16 dilde günlük hikayelerle kelime öğren
      </p>

    </header>


    <!-- =========================================
         GÜNLER
    ========================================== -->

    <section class="days-section">

      <h2>
        Günler
      </h2>

      <div id="days-list">

        <p class="loading-days">
          Günler yükleniyor...
        </p>

      </div>

    </section>

  </main>



  <!-- =========================================
       SORU SAYFASI
  ========================================== -->

  <main
    id="question-page"
    style="display: none;"
  >


    <!-- DİL SEÇİCİ -->

    <div
      id="language-selector"
      class="language-selector"
      aria-label="Dil seçimi"
    ></div>


    <!-- ÜST NAVİGASYON -->

    <nav
      id="top-navigation"
      class="navigation"
      aria-label="Soru navigasyonu"
    ></nav>


    <!-- SORU İÇERİĞİ -->

    <section
      id="question-content"
      class="question-content"
    ></section>


    <!-- ALT NAVİGASYON -->

    <nav
      id="bottom-navigation"
      class="navigation"
      aria-label="Alt navigasyon"
    ></nav>

  </main>



  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer>

    <p>
      Her Güne 1 Hikaye
    </p>

  </footer>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>

</html>
